name: Watchlist agent (ingest + paper trading)

# Runs scripts/run_watchlist_agent.py against the hosted Supabase Postgres
# DB (db/cloud_conn.py's CloudConnection) -- one tick already does
# ingest + alias assignment + candidate detection/paper fills + mark
# recording + settlement + wallet-outcome checks (see
# scripts/run_watchlist_agent.py's run()), so this is the only workflow
# needed for the non-execution half of the live path. See the hosting
# plan: requalification frequency (which wallets are even on the
# watchlist) is a separate, local-only, manual lever
# (scripts/sync_watchlist_to_cloud.py) -- unaffected by this schedule.
#
# No `schedule:` trigger (see conversation): GitHub's own cron is
# best-effort with no SLA and was confirmed firing every 6-7h instead of
# the configured 15 min, and at one point got stuck re-running a stale
# commit for days. Supabase's pg_cron (same project as CLOUD_DATABASE_URL)
# now calls this workflow's `dispatches` API endpoint every 15 min instead
# -- `workflow_dispatch`-triggered runs aren't subject to the same
# scheduling delay, confirmed firing within seconds of the cron tick.

on:
  workflow_dispatch: {}

concurrency:
  group: watchlist-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python scripts/run_watchlist_agent.py
        env:
          CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}
